name: Flutter verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded
      - run: flutter build web --dart-define=LOCAL_DEMO=true --pwa-strategy=none

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix rules-tests
      - run: npm install --global firebase-tools@13.35.1
      - run: firebase emulators:exec --project demo-stark-rules --config firebase.rules-test.json --only firestore "npm test --prefix rules-tests"
